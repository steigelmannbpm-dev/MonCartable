name: Build APK Mon Cartable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Installer dependances
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential git \
          libssl-dev libffi-dev zlib1g-dev libbz2-dev \
          liblzma-dev libreadline-dev libsqlite3-dev \
          libltdl-dev unzip zip openjdk-17-jdk
        pip install -q cython==0.29.37 buildozer
    - name: Build APK
      run: buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MonCartable-APK
        path: bin/*.apk
